<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions</title>
</head>

<style>
    body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    * {
        box-sizing: border-box;
    }

    #questions {
        width: 100%;
        flex-grow: 1;
        padding: 16px;
        font-size: 16px;
    }

    .flex {
        display: flex;
    }

    .justify-right {
        justify-content: flex-end;
    }

    .btn {
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        box-shadow: 2px 4px 4px #0004;
        cursor: pointer;
    }

    .btn:hover {
        box-shadow: none;
    }
</style>

<script>
    function save() {
        const questions = document.getElementById('questions').value;

        fetch("https://ca26-83-234-227-50.ngrok-free.app/questions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ questions }),
        })
            .then(response => {
                return response.json();
            })
            .then(body => {
                alert(body.message);
            })
            .catch(error => alert(error.message));
    }
</script>

<body>
    <textarea id="questions"></textarea>
    <div class="flex justify-right">
        <button class="btn" onclick="save()">
            Save
        </button>
    </div>
</body>

</html>
