<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common.css?ver=1.1">
    <link rel="stylesheet" href="/css/cryptales.css?ver=1.0">
    <title>CRYPTALES</title>
</head>

<body>
    <button class="btn" id="return">
        <svg width="24" height="25" viewBox="0 0 24 25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M10.2222 9.05556V5.5L4 11.7222L10.2222 17.9444V14.3C14.6667 14.3 17.7778 15.7222 20 18.8333C19.1111 14.3889 16.4444 9.94444 10.2222 9.05556Z"
                fill="#EBEBEB" />
        </svg>
    </button>
    <div class="welcome-screen" id="welcome-screen">
        <h1>Welcome to "CRYPTALES"</h1>
        <p>Test your knowledge of crypto myths and facts.</p>
        <button id="start-game-button">Start Game</button>
    </div>

    <div class="game-container" id="game-container" style="display: none;">
        <div class="game-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="question-container">
                <div id="question-text"></div>
            </div>
            <div class="button-container">
                <button id="myth-button" onclick="submitAnswer('Myth')">Myth</button>
                <button id="fact-button" onclick="submitAnswer('Fact')">Fact</button>
            </div>
            <button id="next-button" onclick="nextQuestion()" style="display: none; margin-top: 20px;">Next</button>
            <div id="feedback" class="feedback"></div>
            <div class="timer">Time: <span id="timer">0</span>s</div>
            <div id="explanation" class="explanation"></div>
        </div>
    </div>
</body>

<script src="/js/common.js?ver=1.1"></script>
<script src="/js/cryptales.js?ver=1.3"></script>

</html>
