<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/common.css?v=1.1">
  <link rel="stylesheet" href="/css/pump.css?v=1.0">
  <title>PUMP&DUMP</title>
</head>

<body>
  <button class="btn" id="return">
    <svg width="24" height="25" viewBox="0 0 24 25" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M10.2222 9.05556V5.5L4 11.7222L10.2222 17.9444V14.3C14.6667 14.3 17.7778 15.7222 20 18.8333C19.1111 14.3889 16.4444 9.94444 10.2222 9.05556Z"
        fill="#EBEBEB" />
    </svg>
  </button>
  <div class="container">
    <div id="welcome">
      <h1 class="text-center">
        Welcome to "PUMP&DUMP"
      </h1>
      <p class="text-center">
        Get ready to ride the waves of crypto volatility!
      </p>
      <p class="mt-4">
        Choose your avatar
      </p>
      <div class="icon-container">
        <div class="icon-row">
          <img id="icon7" class="icon" src="/img/pump/icon7.png?v=1.0" />
          <img id="icon1" class="icon" src="/img/pump/icon1.png?v=1.0" />
          <img id="icon2" class="icon" src="/img/pump/icon2.png?v=1.0" />
          <img id="icon4" class="icon" src="/img/pump/icon4.png?v=1.0" />
        </div>
        <div class="icon-row">
          <img id="icon5" class="icon" src="/img/pump/icon5.png?v=1.0" />
          <img id="icon6" class="icon" src="/img/pump/icon6.png?v=1.0" />
          <img id="icon0" class="icon" />
          <div id="upload">
            <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <rect x="15" y="0" width="6" height="36" fill="white" />
              <rect x="0" y="15" width="36" height="6" fill="white" />
            </svg>
          </div>
        </div>
      </div>
      <button id="start" class="mt-4 btn">
        Start Game
      </button>
    </div>
    <div id="game" class="hide">
      <canvas id="canvas" class="canvas" width="375" height="560"></canvas>
    </div>
    <div id="scoreboard" class="hide">
      <canvas id="confettiCanvas"></canvas>
      <h1>
        PUMP&DUMP
      </h1>
      <h1 id="score"></h1>
      <button id="play_again" class="btn">
        Play again
      </button>
    </div>
  </div>
  <div class="modal-container hide" id="upload_confirm_modal">
    <div class="upload-confirm-modal">
      You should select *.png image
      <div class="modal-button-container">
        <button id="ok" class="btn btn-primary">
          Ok
        </button>
        <button id="cancel" class="btn btn-danger">
          Cancel
        </button>
      </div>
    </div>
  </div>
</body>

<script src="/js/common.js"></script>
<script src="/js/pump.js"></script>

</html>
