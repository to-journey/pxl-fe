<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMARA DRIP</title>
  <script src="https://cdn.jsdelivr.net/npm/gif.js/dist/gif.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif/omggif.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/css/common.css?ver=1.1">
  <link rel="stylesheet" href="/css/lumara.css?ver=1.0">
</head>

<body>
  <button class="btn" id="return">
    <svg width="24" height="25" viewBox="0 0 24 25" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M10.2222 9.05556V5.5L4 11.7222L10.2222 17.9444V14.3C14.6667 14.3 17.7778 15.7222 20 18.8333C19.1111 14.3889 16.4444 9.94444 10.2222 9.05556Z"
        fill="#EBEBEB" />
    </svg>
  </button>
  <div class="container">
    <div id="welcome">
      <h1 class="text-center">
        Welcome to "LUMARA DRIP"
      </h1>
      <p class="text-center">
        Fill up your Lumara tank but watch out for the falling stalactites!
      </p>
      <button id="start" class="mt-4 btn">
        Start Game
      </button>
    </div>
    <div id="game" class="hide">
      <canvas id="canvas" class="canvas" width="375" height="560"></canvas>
    </div>
    <div id="scoreboard" class="hide">
      <canvas id="confettiCanvas"></canvas>
      <h1>
        LUMARA DRIP
      </h1>
      <h1 id="score"></h1>
      <button id="play_again" class="btn">
        Play again
      </button>
    </div>
  </div>
</body>

<script src="/js/common.js?ver=1.1"></script>
<script src="/js/lumara.js?ver=1.1"></script>

</html>
